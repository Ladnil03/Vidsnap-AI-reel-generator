name: CI Pipeline

on:
  push:
    branches: [ main, backend/dev ]
  pull_request:
    branches: [ main, backend/dev ]

jobs:
  backend:
    name: Backend Lint, Typecheck & Tests
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Ruff Linter
        run: ruff check backend/ tests/

      - name: Run Mypy Type Checker
        run: mypy backend/app/identity backend/app/core/config.py backend/app/core/security.py

      - name: Run Pytest Test Suite with Coverage (>= 80%)
        env:
          ENVIRONMENT: test
          MONGODB_URI: mongodb://localhost:27017
          REDIS_URL: redis://localhost:6379/0
          STORAGE_PROVIDER: local
          EMAIL_PROVIDER: console
          JWT_SECRET_KEY: ci_test_secret_key_min_32_characters_long_12345
        run: |
          pytest tests/ -v --cov=backend/app --cov-report=term-missing --cov-fail-under=80

      - name: Run Dependency Audit (pip-audit)
        run: |
          pip-audit --desc || true

  security-scans:
    name: Secret & Vulnerability Scanners
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

  frontend:
    name: Frontend Lint, Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Run ESLint Linter
        run: npx eslint --quiet

      - name: Run Next.js Production Build
        run: npm run build
