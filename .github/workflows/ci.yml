name: CI Pipeline

on:
  push:
    branches: [ main, backend/dev ]
  pull_request:
    branches: [ main, backend/dev ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mongomock mongomock-motor ruff

      - name: Run Ruff Linter
        run: ruff check backend/ tests/

      - name: Run Pytest Test Suite
        env:
          ENVIRONMENT: test
          MONGODB_URI: mongodb://localhost:27017
          REDIS_URL: redis://localhost:6379/0
          STORAGE_PROVIDER: local
          EMAIL_PROVIDER: console
          JWT_SECRET_KEY: ci_test_secret_key_min_32_characters_long_12345
        run: |
          pytest tests/ -v --cov=backend/app --cov-report=term-missing
