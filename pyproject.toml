[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["frontend", "env", ".venv", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "RUF"]
ignore = [
    "B008",     # Depends() in default args — standard FastAPI pattern
    "BLE001",   # Broad exception catching — intentional for infra resilience
    "S104",     # Binding to all interfaces — expected for containerized deployments
    "S105",     # Hardcoded password — only in test fixtures, not production code
    "S106",     # Possible hardcoded password — false positive on token_type="bearer"
    "S110",     # try-except-pass — used in test setup where mongomock doesn't support all features
    "UP017",    # datetime.UTC alias — adopt incrementally, timezone.utc is equally valid
    "UP042",    # StrEnum — adopt incrementally when comfortable with 3.11+ minimum
    "RUF059",   # Unused unpacked var — FFmpeg stdout intentionally captured for debugging
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]  # Allow assert and hardcoded passwords in tests
"backend/app/core/adapters/email_*.py" = ["E501"]  # HTML email templates have long lines

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "silent"
check_untyped_defs = true
disallow_untyped_defs = false
disable_error_code = ["import-untyped", "attr-defined"]
